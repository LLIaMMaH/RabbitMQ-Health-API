services:
  rabbitmq-health-api:
    container_name: rabbitmq-health-api
    image: rabbitmq-health-api:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "14101:14101"
    volumes:
      - ./logs:/app/logs
    mem_limit: 512M
    memswap_limit: 1G
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:14101/api/rabbitmq/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal

networks:
  internal:
    driver: bridge
